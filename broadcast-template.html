
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kingdom Heritage Broadcast Template</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#broadcast {
  position: relative;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

#preacherVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

#audioTracks {
  display: none;
}

#offline {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 20px;
  background: #111;
}

#scriptureOverlay {
  position: absolute;
  left: 4%;
  right: 4%;
  bottom: 5%;
  padding: 18px 22px;
  background: rgba(0, 0, 0, 0.82);
  border-bottom: 4px solid #d6b34a;
  border-radius: 8px;
  color: white;
  text-align: center;
  display: none;
  z-index: 10;
}

#scriptureReference {
  color: #f3d16b;
  font-size: clamp(18px, 3vw, 30px);
  font-weight: bold;
  margin-bottom: 10px;
}

#scriptureText {
  font-size: clamp(19px, 3.2vw, 34px);
  line-height: 1.5;
  font-weight: 600;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#channelName {
  position: absolute;
  top: 3%;
  left: 3%;
  padding: 8px 13px;
  background: rgba(0,0,0,.65);
  color: white;
  font-size: clamp(12px, 2vw, 19px);
  border-radius: 5px;
  z-index: 10;
}

#error {
  position: absolute;
  bottom: 2%;
  left: 2%;
  color: white;
  background: #a00000;
  padding: 8px;
  display: none;
  z-index: 20;
}
</style>
</head>

<body>

<div id="broadcast">

  <video
    id="preacherVideo"
    autoplay
    playsinline
    muted
  ></video>

  <div id="audioTracks"></div>

  <div id="offline">
    Connecting to Kingdom Heritage broadcast...
  </div>

  <div id="channelName">
    KINGDOM HERITAGE NETWORK GLOBAL MISSIONS
  </div>

  <div id="scriptureOverlay">
    <div id="scriptureReference"></div>
    <div id="scriptureText"></div>
  </div>

  <div id="error"></div>

</div>

<script>
/* SUPABASE CONFIGURATION */

const SUPABASE_URL =
  "https://pyzifnxflqvclctwogdz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9ewFHMOrQsopkeQziD5z1w_ZB4Zmc58";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ELEMENTS */

const video = document.getElementById("preacherVideo");
const offline = document.getElementById("offline");
const overlay = document.getElementById("scriptureOverlay");
const reference = document.getElementById("scriptureReference");
const scriptureText = document.getElementById("scriptureText");
const audioTracks = document.getElementById("audioTracks");
const errorBox = document.getElementById("error");

let room = null;
let scriptureChannel = null;

/* DISPLAY ERROR */

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
  console.error(message);
}

/* SCRIPTURE DISPLAY */

async function loadScripture() {
  try {
    const { data, error } = await sb
      .from("kh_scripture_display")
      .select(
        "reference,scripture_text,bible_version,display_enabled,display_order,updated_at"
      )
      .eq("display_enabled", true)
      .order("updated_at", { ascending: false })
      .limit(1)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      overlay.style.display = "none";
      return;
    }

    reference.textContent =
      data.reference ||
      data.bible_version ||
      "";

    scriptureText.textContent =
      data.scripture_text || "";

    overlay.style.display =
      data.scripture_text ? "block" : "none";

  } catch (error) {
    console.error("Scripture loading error:", error);
  }
}

/* REALTIME SCRIPTURE UPDATES */

function subscribeScripture() {

  scriptureChannel = sb
    .channel("broadcast-scripture-overlay")

    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "kh_scripture_display"
      },
      () => {
        loadScripture();
      }
    )

    .subscribe();

}

/* VIDEO TRACKS */

function handleTrack(track) {

  if (track.kind === "video") {

    track.attach(video);

    video.muted = true;
    video.play().catch(error => {
      console.log("Video autoplay:", error);
    });

    offline.style.display = "none";
  }

  if (track.kind === "audio") {

    const audioElement = track.attach();

    audioElement.autoplay = true;
    audioElement.controls = false;

    audioTracks.appendChild(audioElement);

    audioElement.play().catch(error => {
      console.log("Audio autoplay:", error);
    });
  }
}

/* LIVEKIT CONNECTION */

async function connectBroadcast() {

  try {

    const params = new URLSearchParams(
      window.location.search
    );

    const serverUrl = params.get("url");
    const token = params.get("token");

    if (!serverUrl || !token) {
      throw new Error(
        "LiveKit connection details are missing."
      );
    }

    room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true
    });

    room.on(
      LivekitClient.RoomEvent.TrackSubscribed,
      (track) => {
        handleTrack(track);
      }
    );

    room.on(
      LivekitClient.RoomEvent.TrackUnsubscribed,
      (track) => {
        track.detach();
      }
    );

    room.on(
      LivekitClient.RoomEvent.Disconnected,
      () => {
        offline.style.display = "flex";
        offline.textContent = "Broadcast disconnected.";
      }
    );

    await room.connect(serverUrl, token);

    /* HANDLE TRACKS ALREADY AVAILABLE */

    room.remoteParticipants.forEach(participant => {

      participant.trackPublications.forEach(publication => {

        if (publication.track && publication.isSubscribed) {
          handleTrack(publication.track);
        }

      });

    });

    await loadScripture();
    subscribeScripture();

    /* SIGNAL TO LIVEKIT EGRESS */

    console.log("START_RECORDING");

  } catch (error) {

    showError(error.message);

    offline.textContent =
      "Unable to connect to the broadcast.";

    console.error("Broadcast error:", error);

  }

}

/* START */

connectBroadcast();

/* CLEANUP */

window.addEventListener("beforeunload", () => {

  if (room) {
    room.disconnect();
  }

  if (scriptureChannel) {
    sb.removeChannel(scriptureChannel);
  }

});
</script>

</body>
    </html>
