
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church E-Library | Kingdom Heritage Network</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#f4f6fa;color:#222}
header{background:#172554;color:white;padding:25px;text-align:center}
main{max-width:900px;margin:25px auto;padding:15px}
input,select{padding:13px;margin:5px 0;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:7px}
.card{background:white;padding:18px;margin:15px 0;border-radius:10px;box-shadow:0 2px 8px #ddd}
button,.btn{background:#07562f;color:white;padding:10px 16px;border:0;border-radius:6px;text-decoration:none;display:inline-block;margin:5px;cursor:pointer}
</style>
</head>
<body>

<header>
<h2>Kingdom Heritage Network Global Missions</h2>
<h3>Church E-Library</h3>
<p>Accurate dispensation of the word, true worship and intercession.</p>
</header>

<main>
<input id="search" placeholder="Search books and materials...">
<select id="filter">
<option value="">All Categories</option>
</select>

<div id="resources">Loading materials...</div>
</main>

<script>
const URL="https://pyzifnxflqvclctwogdz.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5emlmbnhmbHF2Y2xjdHdvZ2R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5Mjk2MTgsImV4cCI6MjEwNjUwNTYxOH0.o_b4ZsTB4GSE-7v5p1Pynchdf8Sdol_q0Xkzpmcx-tc";
const TABLE="kh_elibrary_materials";
const BUCKET="kh-elibrary";

const db=supabase.createClient(URL,KEY);
let materials=[];

async function load(){
 const box=document.getElementById("resources");
 box.textContent="Loading materials...";

 const {data,error}=await db.from(TABLE)
 .select("*")
 .eq("is_published",true)
 .order("created_at",{ascending:false});

 if(error){
  box.textContent="Unable to load materials: "+error.message;
  return;
 }

 materials=data||[];

 const categories=[...new Set(materials.map(x=>x.category).filter(Boolean))];
 const filter=document.getElementById("filter");
 categories.forEach(c=>filter.add(new Option(c,c)));

 render();
}

function render(){
 const search=document.getElementById("search").value.toLowerCase();
 const category=document.getElementById("filter").value;
 const box=document.getElementById("resources");

 box.replaceChildren();

 const results=materials.filter(x=>
  (x.title||"").toLowerCase().includes(search) &&
  (!category||x.category===category)
 );

 if(!results.length){
  box.textContent="No published materials found.";
  return;
 }

 results.forEach(x=>{
  const url=db.storage.from(BUCKET).getPublicUrl(x.file_path).data.publicUrl;
  const card=document.createElement("div");
  card.className="card";

  const title=document.createElement("h3");
  title.textContent=x.title||"Untitled";

  const description=document.createElement("p");
  description.textContent=x.description||"";

  const categoryText=document.createElement("p");
  categoryText.textContent="Category: "+(x.category||"General");

  const view=document.createElement("a");
  view.href=url;
  view.target="_blank";
  view.rel="noopener";
  view.className="btn";
  view.textContent="View Material";

  const download=document.createElement("a");
  download.href=url;
  download.download=x.file_name||"material";
  download.className="btn";
  download.textContent="Download";

  card.append(title,description,categoryText,view,download);
  box.appendChild(card);
 });
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("filter").addEventListener("change",render);

load();
</script>
</body>
</html>
