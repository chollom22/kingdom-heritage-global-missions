
<script>
const URL="https://bmiechymiyedubezhcqk.supabase.co";
const KEY="sb_publishable_9ewFHMOrQsopkeQziD5z1w_ZB4Zmc58";

const $=id=>document.getElementById(id);
let db,records=[];

function showLogin(){
  $("login").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
  $("logout").classList.add("hidden");
}

async function initialize(){
  try{
    const {data:{session},error}=await db.auth.getSession();
    if(error)throw error;
    if(!session){showLogin();return;}

    const {data:admin,error:adminError}=await db
      .from("prayer_admins")
      .select("email,role")
      .eq("user_id",session.user.id)
      .maybeSingle();

    if(adminError)throw adminError;

    if(!admin){
      await db.auth.signOut();
      showLogin();
      $("loginMessage").textContent="Access denied. You are not an authorized administrator.";
      return;
    }

    $("login").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    $("logout").classList.remove("hidden");
    $("adminInfo").textContent=admin.email+" | "+admin.role;

    await loadRequests();
  }catch(e){
    showLogin();
    $("loginMessage").textContent="Error: "+e.message;
  }
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const btn=$("loginBtn");
  btn.disabled=true;
  btn.textContent="Signing in...";
  $("loginMessage").textContent="";

  try{
    const {error}=await db.auth.signInWithPassword({
      email:$("email").value.trim(),
      password:$("password").value
    });

    if(error)throw error;

    await initialize();
  }catch(e){
    $("loginMessage").textContent="Login failed: "+e.message;
  }finally{
    btn.disabled=false;
    btn.textContent="Login";
  }
});

async function loadRequests(){
  $("requests").textContent="Loading prayer requests...";

  const {data,error}=await db
    .from("prayer_requests")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    $("requests").textContent="Error: "+error.message;
    return;
  }

  records=data||[];
  statistics();
  displayRequests();
}

function statistics(){
  $("total").textContent=records.length;
  $("pending").textContent=records.filter(r=>r.status==="Pending").length;
  $("progressCount").textContent=records.filter(r=>r.status==="In Progress").length;
  $("answered").textContent=records.filter(r=>r.status==="Answered").length;
}

function element(tag,value,cls){
  const el=document.createElement(tag);
  el.textContent=value??"";
  if(cls)el.className=cls;
  return el;
}

function displayRequests(){
  const list=$("requests");
  list.replaceChildren();

  const term=$("search").value.toLowerCase();
  const filter=$("filter").value;

  const filtered=records.filter(r=>{
    const match=[r.full_name,r.email,r.phone,r.prayer_category,r.prayer_request]
      .some(v=>String(v||"").toLowerCase().includes(term));
    return match&&(filter==="All"||r.status===filter);
  });

  if(!filtered.length){
    list.textContent="No prayer requests found.";
    return;
  }

  filtered.forEach(r=>{
    const card=element("article","","request");
    card.append(element("h3",r.full_name));
    card.append(element("p","Category: "+r.prayer_category));
    card.append(element("p","Email: "+(r.email||"Not provided")));
    card.append(element("p","Phone: "+(r.phone||"Not provided")));
    card.append(element("p","Confidential: "+(r.is_confidential?"Yes":"No")));
    card.append(element("p","Prayer Point: "+r.prayer_request));
    card.append(element("p","Submitted: "+new Date(r.created_at).toLocaleString(),"small"));

    card.append(element("span",r.status,
      r.status==="Answered"?"status answered":
      r.status==="In Progress"?"status progress":"status"));

    card.append(element("h4","Update Status"));

    const status=document.createElement("select");
    ["Pending","In Progress","Answered"].forEach(s=>{
      const option=element("option",s);
      option.value=s;
      option.selected=s===r.status;
      status.append(option);
    });
    card.append(status);

    card.append(element("h4","Private Admin Notes"));
    const notes=document.createElement("textarea");
    notes.placeholder="Write internal notes...";
    notes.value=r.admin_notes||"";
    card.append(notes);

    const actions=element("div","","actions");
    const save=element("button","Save Changes");
    const remove=element("button","Delete Request","delete");

    save.type="button";
    remove.type="button";
    save.onclick=()=>updateRequest(r.id,status.value,notes.value,save);
    remove.onclick=()=>deleteRequest(r.id);

    actions.append(save,remove);
    card.append(actions);
    list.append(card);
  });
}

async function updateRequest(id,status,notes,button){
  button.disabled=true;
  const {error}=await db.from("prayer_requests")
    .update({status,admin_notes:notes}).eq("id",id);
  button.disabled=false;

  if(error){alert("Update failed: "+error.message);return;}

  $("notice").textContent="Request updated successfully.";
  $("notice").className="success";
  await loadRequests();
}

async function deleteRequest(id){
  if(!confirm("Permanently delete this prayer request?"))return;

  const {error}=await db.from("prayer_requests").delete().eq("id",id);
  if(error){alert("Delete failed: "+error.message);return;}

  $("notice").textContent="Prayer request deleted.";
  $("notice").className="success";
  await loadRequests();
}

$("search").addEventListener("input",displayRequests);
$("filter").addEventListener("change",displayRequests);
$("refresh").addEventListener("click",loadRequests);

$("logout").addEventListener("click",async()=>{
  await db.auth.signOut();
  showLogin();
});

try{
  if(!window.supabase)throw new Error("Supabase library did not load. Check your internet connection and reload.");
  db=window.supabase.createClient(URL,KEY);
  initialize();
}catch(e){
  showLogin();
  $("loginMessage").textContent=e.message;
}
  </script>
</body>
</html>
